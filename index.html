<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pranathi AI 💜</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2, #c471ed);
}

.app {
  max-width: 650px;
  margin: 10px auto;
  background: #fff;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 12px 35px #20104055;
}

header {
  padding: 24px 15px;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #6a11cb, #9b59b6);
}

.logo {
  font-size: 45px;
}

header h1 {
  margin: 8px 0;
  font-size: 29px;
}

.subtitle {
  font-size: 14px;
}

.status {
  margin-top: 12px;
  font-size: 12px;
}

.status span {
  color: #aaffbd;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: #faf7ff;
}

.toolbar button,
.suggestions button {
  border: 1px solid #d9c5ff;
  background: #f1e8ff;
  color: #6335a5;
  padding: 10px 12px;
  border-radius: 18px;
  cursor: pointer;
}

#chat {
  height: 45vh;
  min-height: 280px;
  max-height: 480px;
  overflow-y: auto;
  padding: 15px;
  background: #fff;
}

.message {
  max-width: 90%;
  padding: 12px;
  margin: 12px 0;
  border-radius: 16px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.5;
}

.bot {
  background: #eee5ff;
  color: #352052;
  border-bottom-left-radius: 4px;
}

.user {
  background: linear-gradient(135deg, #805ad5, #6b46c1);
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.name {
  display: block;
  font-weight: bold;
  font-size: 12px;
  margin-bottom: 5px;
}

.message-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.message-actions button {
  background: #fff;
  border: 1px solid #d8c5ff;
  border-radius: 12px;
  padding: 6px 10px;
  cursor: pointer;
}

.suggestions {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
  background: #faf7ff;
}

.suggestions button {
  white-space: nowrap;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: white;
  border-top: 1px solid #eee;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #d7c9ed;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #805ad5;
}

.send,
.mic {
  border: none;
  border-radius: 14px;
  padding: 12px 15px;
  color: white;
  background: #7545c5;
  font-size: 16px;
  cursor: pointer;
}

.mic {
  background: #e85d9e;
}

footer {
  padding: 15px;
  text-align: center;
  color: #796b8d;
  background: white;
  font-size: 12px;
}

#notice {
  padding: 0 14px 12px;
  color: #7144a5;
  font-size: 13px;
  background: white;
}
</style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">🤖💜</div>
    <h1>Pranathi AI</h1>
    <div class="subtitle">Your Friendly Chat Assistant</div>
    <div class="status"><span>●</span> Ready to chat!</div>
  </header>

  <div class="toolbar">
    <button onclick="toggleVoice()" id="voiceToggle">
      🔊 Voice: ON
    </button>

    <button onclick="clearChat()">🧹 Clear Chat</button>
  </div>

  <div id="chat" aria-live="polite">
    <div class="message bot">
      <span class="name">🤖 Pranathi AI</span>
      Hello! 👋 Welcome to Pranathi AI! 💜

      Natho chat cheyyi.
      Message type cheyyachu, lekapothe 🎤 microphone try cheyyachu!
    </div>
  </div>

  <div class="suggestions">
    <button onclick="quickSend('Hi')">👋 Hi</button>
    <button onclick="quickSend('What is your name?')">🤖 Your name</button>
    <button onclick="quickSend('How are you?')">😊 How are you?</button>
    <button onclick="quickSend('Help')">💡 Help</button>
  </div>

  <div class="input-area">
    <button class="mic" onclick="listen()" title="Speak">
      🎤
    </button>

    <input
      id="msg"
      placeholder="Type or speak..."
      autocomplete="off"
      aria-label="Your message">

    <button class="send" onclick="sendMsg()">➤</button>
  </div>

  <div id="notice" role="status">
    💜 Female voice available unte automatic ga select avuthundi.
  </div>

  <footer>
    Made with 💜 by Pranathi
  </footer>

</div>

<script>
let voiceEnabled = true;
let femaleVoice = null;
let recognition = null;

const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const notice = document.getElementById("notice");

function loadVoices() {
  if (!("speechSynthesis" in window)) return;

  const voices = window.speechSynthesis.getVoices();

  const preferred = voices.filter(v =>
    /female|woman|zira|samantha|susan|karen|veena|heera|priya/i
      .test(v.name)
  );

  femaleVoice =
    preferred.find(v => /^en[-_]IN/i.test(v.lang)) ||
    preferred.find(v => /^en/i.test(v.lang)) ||
    preferred[0] ||
    voices.find(v => /^en[-_]IN/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) ||
    null;
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!voiceEnabled || !("speechSynthesis" in window)) {
    return;
  }

  loadVoices();

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  if (femaleVoice) {
    utterance.voice = femaleVoice;
  }

  utterance.lang = femaleVoice ? femaleVoice.lang : "en-IN";
  utterance.rate = 0.95;
  utterance.pitch = 1.12;

  window.speechSynthesis.speak(utterance);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceToggle").textContent =
    voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";

  if (!voiceEnabled && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  notice.textContent = voiceEnabled
    ? "🔊 Voice enabled. Female voice available unte use avuthundi."
    : "🔇 Voice off chesavu.";
}

function addMessage(name, text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;

  const label = document.createElement("span");
  label.className = "name";
  label.textContent = type === "bot" ? "🤖 " + name : "💬 " + name;

  box.appendChild(label);
  box.appendChild(document.createTextNode(text));

  if (type === "bot") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const listenButton = document.createElement("button");
    listenButton.textContent = "🔊 Listen";
    listenButton.onclick = () => speak(text);

    actions.appendChild(listenButton);
    box.appendChild(actions);
  }

  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function getReply(message) {
  const text = message.toLowerCase();
  let reply = "Sorry! I don't know that yet. 😊 Try saying Hi or Help.";

    text === "hi" ||
    text.includes("hello") ||

  ) {
    reply = "Hello! 👋 Welcome to Pranathi AI! 💜";

    text.includes("your name") ||
    text.includes("nee peru") ||
    text.includes("నీ పేరు")
  ) {
    reply = "My name is Pranathi AI! 🤖💜";

  } else if (
    text.includes("good morning")
  ) {
    reply = "Good morning! 🌞 Have a beautiful day!";
  } else if (
    text.includes("good night")
  ) {
    reply = "Good night! 🌙 Sweet dreams!";
  } else if (
    text.includes("bye") ||
    text.includes("goodbye")
  ) {
    reply = "Goodbye! 👋 Have a wonderful day!";
  } else if (
    text.includes("thank") ||
    text.includes("ధన్యవాద")
  ) {
    reply = "You're welcome! 💜😊";

    text.includes("help")

    reply = "Try saying Hi, asking my name, or asking how I am. 🎤 You can also try the microphone!";
  } else if (
    text.includes("love you")

    reply = "That's kind of you! 💜 I'm happy to chat and help you.";
  } else if (

  ) {

  } else if (
    text.includes("నీ పేరు")
  ) {
    reply = "నా పేరు Pranathi AI! 🤖💜";
  } else if (
    text.includes("ఎలా ఉన్నావు")
  ) {
    reply = "నేను బాగున్నాను! 😊 నువ్వు ఎలా ఉన్నావు?";
  } else if (
    text.includes("ఏం చేస్తున్నావు")
  ) {
    reply = "నీతో మాట్లాడుతున్నాను! 😊💜";
